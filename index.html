<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypotheek Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0; 
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: auto;
            min-height: auto;
            box-sizing: border-box;
        }
        table {
            width: 100%;
            max-width: 310px; 
            border-collapse: collapse;
            background-color: #2c2c2e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        td {
            padding: 10px 14px;
            text-align: left;
            font-size: 0.85rem;
            border-bottom: 1px solid #3a3a3c;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .label {
            color: #8e8e93;
            font-weight: 500;
            white-space: nowrap;
        }
        .waarde {
            color: #8e8e93;
            text-align: right;
            font-weight: bold;
            font-size: 0.95rem;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .highlight {
            color: #30d158; /* iOS Systeemgroen */
        }
        .kleine-eenheid {
            font-size: 0.75rem;
            font-weight: normal;
            margin-left: 1px;
            margin-right: 3px;
            color: #aaaaaa; /* Standaard grijs voor letters op de andere rijen */
        }
        /* Zorgt ervoor dat de kleine eenheid binnen een highlight-groep (zoals Nu) ook groen wordt */
        .highlight .kleine-eenheid {
            color: inherit; 
        }
        .kleine-eenheid:last-child {
            margin-right: 0;
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <td id="label-nu" class="label">Nu</td>
                <td id="nu" class="waarde highlight">Laden...</td>
            </tr>
            <tr>
                <td class="label">Verlengdatum (28 dec)</td>
                <td id="dec-2026" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-half-jaar" class="label">Half Jaar</td>
                <td id="half-jaar" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-jaar" class="label">Jaar</td>
                <td id="jaar" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-next-1k" class="label">Next 1K</td>
                <td id="next-1k" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-next-10k" class="label">Next 10K</td>
                <td id="next-10k" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-next-100k" class="label">Next 100K</td>
                <td id="next-100k" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-tot-1m" class="label">Tot 1M</td>
                <td id="tot-1m" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-tot-679k" class="label">Tot 679K</td>
                <td id="tot-679k" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-tot-0" class="label">Tot 0</td>
                <td id="tot-0" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td id="label-leningsgraad" class="label">Leningsgraad</td>
                <td id="leningsgraad" class="waarde">Laden...</td>
            </tr>
            <tr>
                <td class="label">Updated</td>
                <td id="updated" class="waarde">Laden...</td>
            </tr>
        </tbody>
    </table>
    <script>
        // Constanten
        const START_BEDRAG = 1258000; 
        const AFNAME_PER_MAAND = 15000;
        const START_UNIX_MS = 1769551200000; 
        const MAX_BEDRAG = 2600000;
    
        // Tijd omrekeningen
        const MS_PER_SEC = 1000;
        const MS_PER_MIN = 60 * MS_PER_SEC;
        const MS_PER_UUR = 60 * MS_PER_MIN;
        const MS_PER_DAG = 24 * MS_PER_UUR;
        const MS_PER_MAAND = 30.4375 * MS_PER_DAG;
        const MS_PER_JAAR = 365.25 * MS_PER_DAG;
        const AFNAME_PER_MS = AFNAME_PER_MAAND / MS_PER_MAAND;
    
        const DEC_2026_UNIX_MS = new Date("2026-12-28T23:00:00+01:00").getTime();
    
        // Datumnotatie formatters (Nederlandse maanden)
        const formatterKort = new Intl.DateTimeFormat('nl-NL', { day: '2-digit', month: 'short' });
        const formatterLang = new Intl.DateTimeFormat('nl-NL', { day: '2-digit', month: 'short', year: '2-digit' });
    
        function formatValuta(bedrag) {
            if (bedrag < 0) bedrag = 0;
            const geformatteerdGetal = bedrag.toLocaleString('nl-NL', { 
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2 
            });
            return `${geformatteerdGetal}<span class="kleine-eenheid">Kr</span>`;
        }
    
        function formatPercentage(percentage) {
            if (percentage < 0) percentage = 0;
            const geformatteerdGetal = percentage.toLocaleString('nl-NL', { 
                minimumFractionDigits: 4, 
                maximumFractionDigits: 4 
            });
            return `${geformatteerdGetal}<span class="kleine-eenheid">%</span>`;
        }
    
        function formatTijdDeel(waarde, letter, forceTwoDigits = false) {
            const getalWeergave = forceTwoDigits ? String(waarde).padStart(2, '0') : waarde;
            return `${getalWeergave}<span class="kleine-eenheid">${letter}</span>`;
        }
    
        // Verkrijg de ms resterend tot een doelbedrag
        function pakMsTotDoel(doelBedrag, actueelBedrag) {
            if (actueelBedrag <= doelBedrag) return 0;
            const benodigdBedragAflossen = actueelBedrag - doelBedrag;
            return benodigdBedragAflossen / AFNAME_PER_MS;
        }
    
        function berekenTijdResterendVanMs(benodigdeMs) {
            if (benodigdeMs <= 0) return "Bereikt";
            
            let overgeblevenMs = benodigdeMs;
            
            const j = Math.floor(overgeblevenMs / MS_PER_JAAR);
            overgeblevenMs %= MS_PER_JAAR;
            
            const ma = Math.floor(overgeblevenMs / MS_PER_MAAND);
            overgeblevenMs %= MS_PER_MAAND;
            
            const d = Math.floor(overgeblevenMs / MS_PER_DAG);
            overgeblevenMs %= MS_PER_DAG;
            
            const u = Math.floor(overgeblevenMs / MS_PER_UUR);
            overgeblevenMs %= MS_PER_UUR;
    
            const min = Math.floor(overgeblevenMs / MS_PER_MIN);
            overgeblevenMs %= MS_PER_MIN;
    
            const sec = Math.floor(overgeblevenMs / MS_PER_SEC);
            
            let output = [];
            
            if (j > 0) {
                output.push(formatTijdDeel(j, 'j', false));
                output.push(formatTijdDeel(ma, 'ma', true));
                output.push(formatTijdDeel(d, 'd', true));
                output.push(formatTijdDeel(u, 'u', true));
            } else if (ma > 0) {
                output.push(formatTijdDeel(ma, 'ma', false));
                output.push(formatTijdDeel(d, 'd', true));
                output.push(formatTijdDeel(u, 'u', true));
                output.push(formatTijdDeel(min, 'm', true));
            } else {
                if (d > 0) output.push(formatTijdDeel(d, 'd', false));
                output.push(formatTijdDeel(u, 'u', true));
                output.push(formatTijdDeel(min, 'm', true));
                output.push(formatTijdDeel(sec, 's', true));
            }
            
            return output.join(" ");
        }
    
        function updateDashboard() {
            const nuMs = Date.now(); 
            const verstrekenMs = nuMs - START_UNIX_MS;
            
            // Actueel bedrag
            let actueelBedrag = START_BEDRAG - (verstrekenMs * AFNAME_PER_MS);
            if (actueelBedrag < 0) actueelBedrag = 0;
            document.getElementById('nu').innerHTML = formatValuta(actueelBedrag);
            
            // Leningsgraad
            const leningsgraad = (actueelBedrag / MAX_BEDRAG) * 100;
            document.getElementById('leningsgraad').innerHTML = formatPercentage(leningsgraad);
            
            // Statische tijdsdoelen vanaf NU gezien
            const datumHalfJaar = new Date(nuMs + (MS_PER_JAAR / 2));
            const datumJaar = new Date(nuMs + MS_PER_JAAR);
            
            document.getElementById('label-half-jaar').innerText = `Half Jaar (${formatterKort.format(datumHalfJaar)})`;
            document.getElementById('label-jaar').innerText = `Jaar (${formatterKort.format(datumJaar)})`;
    
            let schuldHalfJaar = actueelBedrag - ((MS_PER_JAAR / 2) * AFNAME_PER_MS);
            let schuldJaar = actueelBedrag - (MS_PER_JAAR * AFNAME_PER_MS);
            
            const verstrekenMsDec2026 = DEC_2026_UNIX_MS - START_UNIX_MS;
            let schuldDec2026 = START_BEDRAG - (verstrekenMsDec2026 * AFNAME_PER_MS);
            
            document.getElementById('half-jaar').innerHTML = formatValuta(schuldHalfJaar);
            document.getElementById('jaar').innerHTML = formatValuta(schuldJaar);
            document.getElementById('dec-2026').innerHTML = formatValuta(schuldDec2026);
            
            // Mijlpalen berekenen
            let volgend1kDoel = Math.floor(actueelBedrag / 1000) * 1000;
            if (volgend1kDoel === actueelBedrag) volgend1kDoel -= 1000;
            
            let volgend10kDoel = Math.floor(actueelBedrag / 10000) * 10000;
            if (volgend10kDoel === actueelBedrag) volgend10kDoel -= 10000;
            
            let volgend100kDoel = Math.floor(actueelBedrag / 100000) * 100000;
            if (volgend100kDoel === actueelBedrag) volgend100kDoel -= 100000;
            
            // Milliseconden tot doelen berekenen
            const msTot1k = pakMsTotDoel(volgend1kDoel, actueelBedrag);
            const msTot10k = pakMsTotDoel(volgend10kDoel, actueelBedrag);
            const msTot100k = pakMsTotDoel(volgend100kDoel, actueelBedrag);
            const msTot1m = pakMsTotDoel(1000000, actueelBedrag);
            const msTot679k = pakMsTotDoel(679000, actueelBedrag);
            const msTot0 = pakMsTotDoel(0, actueelBedrag);
    
            // Labels dynamisch updaten met de verwachte datum
            document.getElementById('label-next-1k').innerText = `Next 1K (${formatterKort.format(new Date(nuMs + msTot1k))})`;
            document.getElementById('label-next-10k').innerText = `Next 10K (${formatterKort.format(new Date(nuMs + msTot10k))})`;
            document.getElementById('label-next-100k').innerText = `Next 100K (${formatterKort.format(new Date(nuMs + msTot100k))})`;
            
            document.getElementById('label-tot-1m').innerText = `Tot 1M (${formatterLang.format(new Date(nuMs + msTot1m))})`;
            document.getElementById('label-tot-679k').innerText = `Tot 679K (${formatterLang.format(new Date(nuMs + msTot679k))})`;
            document.getElementById('label-tot-0').innerText = `Tot 0 (${formatterLang.format(new Date(nuMs + msTot0))})`;
    
            // Waarden invullen
            document.getElementById('next-1k').innerHTML = berekenTijdResterendVanMs(msTot1k);
            document.getElementById('next-10k').innerHTML = berekenTijdResterendVanMs(msTot10k);
            document.getElementById('next-100k').innerHTML = berekenTijdResterendVanMs(msTot100k);
            document.getElementById('tot-1m').innerHTML = berekenTijdResterendVanMs(msTot1m);
            document.getElementById('tot-679k').innerHTML = berekenTijdResterendVanMs(msTot679k);
            document.getElementById('tot-0').innerHTML = berekenTijdResterendVanMs(msTot0);
    
            // Klok bijwerken
            const nuKladaf = new Date();
            const urenStr = String(nuKladaf.getHours()).padStart(2, '0');
            const minutenStr = String(nuKladaf.getMinutes()).padStart(2, '0');
            const secondenStr = String(nuKladaf.getSeconds()).padStart(2, '0');
            document.getElementById('updated').innerText = `${urenStr}:${minutenStr}:${secondenStr}`;
        }
    
        updateDashboard();
        setInterval(updateDashboard, 1000);
    </script>
</body>
</html>
